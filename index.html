<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manasi's Portfolio</title>
  <meta name="description" content="Manasi is a UX designer who knows her tools on both sides, running the research and converting it into design." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Geist+Mono:wght@400;500;600&family=Google+Sans+Flex:wght@400&family=Google+Sans:ital,wght@1,400&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/flower.png" />
</head>
<body>
  <div class="frame">

    <header class="nav">
      <nav class="nav__group" aria-label="Primary">
        <a class="chip chip--nav" href="#home" aria-current="page">home<svg class="chip__arrow" viewBox="0 0 9 9" aria-hidden="true"><path d="M9 .5V7a.5.5 0 0 1-1 0V1.707L.854 8.854a.5.5 0 0 1-.707-.708L7.293 1H2a.5.5 0 0 1 0-1h6.5a.5.5 0 0 1 .5.5Z" /></svg></a>
        <a class="chip chip--nav" href="#work">work<svg class="chip__arrow" viewBox="0 0 9 9" aria-hidden="true"><path d="M9 .5V7a.5.5 0 0 1-1 0V1.707L.854 8.854a.5.5 0 0 1-.707-.708L7.293 1H2a.5.5 0 0 1 0-1h6.5a.5.5 0 0 1 .5.5Z" /></svg></a>
        <a class="chip chip--nav" href="#about">about<svg class="chip__arrow" viewBox="0 0 9 9" aria-hidden="true"><path d="M9 .5V7a.5.5 0 0 1-1 0V1.707L.854 8.854a.5.5 0 0 1-.707-.708L7.293 1H2a.5.5 0 0 1 0-1h6.5a.5.5 0 0 1 .5.5Z" /></svg></a>
      </nav>
      <div class="nav__group">
        <a class="chip chip--nav" href="#contact">contact<svg class="chip__arrow" viewBox="0 0 9 9" aria-hidden="true"><path d="M9 .5V7a.5.5 0 0 1-1 0V1.707L.854 8.854a.5.5 0 0 1-.707-.708L7.293 1H2a.5.5 0 0 1 0-1h6.5a.5.5 0 0 1 .5.5Z" /></svg></a>
        <span class="logo" data-cursor-tag="coming soon!" title="coming soon!">
          <img src="assets/flower.png" alt="" width="29" height="29" draggable="false" />
        </span>
      </div>
    </header>

    <main>
      <section class="hero" id="home">

        <div class="hero__intro">
          <p class="hero__hi">Hi, I’m Manasi</p>

          <div class="hats">
            <ul class="hats__pills" aria-label="Other hats I wear. Pick one to swap it in.">
              <li><button class="chip chip--hat" type="button" data-slot="0"></button></li>
              <li><button class="chip chip--hat" type="button" data-slot="1"></button></li>
              <li><button class="chip chip--hat" type="button" data-slot="2"></button></li>
            </ul>

            <div class="annotation" aria-hidden="true">
              <p>four hats, click </p>
              <p>any to swap :)</p>
              <img class="annotation__arrow" src="assets/arrow.png" alt="" width="22" height="27" draggable="false" />
            </div>
          </div>

          <h1 class="title-box">
            <span class="visually-hidden">Manasi, </span>
            <span class="title-box__text" data-hat-title></span>
            <span class="title-box__handle title-box__handle--tl" aria-hidden="true"></span>
            <span class="title-box__handle title-box__handle--tr" aria-hidden="true"></span>
            <span class="title-box__handle title-box__handle--bl" aria-hidden="true"></span>
            <span class="title-box__handle title-box__handle--br" aria-hidden="true"></span>
          </h1>

          <p class="hero__desc" data-hat-desc aria-live="polite"></p>
        </div>

        <div class="stickies">
          <div class="sticky sticky--card" tabindex="0">
            <p class="sticky__text">Manasi, prev @Bosch<br />is a designer who believes the real craft lies in the thinking.</p>
          </div>

          <div class="sticky sticky--photo" tabindex="0" role="img" aria-label="A lego version of me holding a tablet, next to a little potted flower. Drag to move.">
            <img src="assets/lego-me.png" alt="" draggable="false" />
          </div>

          <div class="sticky sticky--fold" tabindex="0">
            <p class="sticky__text">She's in her play area,<br />building <em>hello, i'm_</em> :)</p>
          </div>
        </div>

        <p class="hero__note">*carrying a mental backpack of tools at all times ;)</p>
      </section>
    </main>

  </div>

  <div class="cursor" aria-hidden="true">
    <img class="cursor__pointer" src="assets/cursor.png" alt="" />
    <img class="cursor__move" src="assets/cursor-move.png" alt="" />
    <span class="cursor__tag"></span>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
